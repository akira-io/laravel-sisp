name: Tests

on:
  push:
    branches: [ main, 1.x, 2.x, 'release/**' ]
  pull_request:
    branches: [ main, 1.x, 2.x, 'release/**' ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.5 ]
        laravel: [ 13.* ]
        stability: [ prefer-lowest, prefer-stable ]
        include:
          - laravel: 13.*
            testbench: ^11.0

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug
          tools: composer:v2

      - name: Install Aspell
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-progress --no-interaction

      - name: Run static analysis and quality gates (Pest)
        run: composer test

      - name: Run test suite (Pest)
        run: vendor/bin/pest --compact

  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            port: 3306
            username: root
            password: password
          - driver: pgsql
            port: 5432
            username: postgres
            password: password

    name: Migrations on ${{ matrix.driver }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sisp_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sisp_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run the package migrations
        env:
          SISP_TEST_DB_DRIVER: ${{ matrix.driver }}
          SISP_TEST_DB_HOST: 127.0.0.1
          SISP_TEST_DB_PORT: ${{ matrix.port }}
          SISP_TEST_DB_DATABASE: sisp_testing
          SISP_TEST_DB_USERNAME: ${{ matrix.username }}
          SISP_TEST_DB_PASSWORD: ${{ matrix.password }}
        run: vendor/bin/pest --compact tests/Database
